name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            command: pnpm --filter @bzs/desktop package -- --win --x64
          - os: macos-15
            arch: x64
            command: pnpm --filter @bzs/desktop package -- --mac --x64
          - os: macos-15
            arch: arm64
            command: pnpm --filter @bzs/desktop package -- --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm version:sync
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/build/*.exe
            apps/desktop/build/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk

  ios-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ios

  publish:
    needs: [desktop, android, ios-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --title "$GITHUB_REF_NAME (unsigned desktop / debug Android)"
        env:
          GH_TOKEN: ${{ github.token }}
